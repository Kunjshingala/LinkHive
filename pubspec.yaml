name: link_hive
description: "A new Flutter project."

version: 1.0.1+1

environment:
  sdk: ^3.10.1
  flutter: ">=3.38.3"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Routing & State
  go_router: any
  flutter_bloc: any
  equatable: any
  rxdart: any
  get_it: any
  intl: any

  # Firebase
  firebase_core: any
  firebase_auth: any
  cloud_firestore: any
  google_sign_in: any

  # Local Storage
  hive_flutter: any

  # Networking & Media
  receive_sharing_intent: any
  cached_network_image: any
  http: any
  internet_connection_checker_plus: any
  uuid: any
  # Serializes save-or-merge so two quick shares can't both create a link.
  synchronized: ^3.4.0

  # UI
  flutter_svg: any
  font_awesome_flutter: any
  url_launcher: ^6.3.2
  share_plus: ^13.3.0

  # Return engine (Daily Resurface)
  flutter_local_notifications: any
  timezone: any
  flutter_timezone: any

  # Home screen widget (Today's pick + stats)
  home_widget: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: any
  hive_generator: any
  build_runner: any
  mocktail: ^1.0.4
  hive_test: ^1.0.1
  bloc_test: any
  mocktail_image_network: ^1.3.0
  # Lets tests swap the real URL launcher for a fake by setting
  # UrlLauncherPlatform.instance. `launchUrl` is a top-level function and can't
  # be mocked directly, and this route runs url_launcher's own argument checks
  # (the non-http(s) guard that shipped a bug) rather than replacing them.
  # Both are already transitive deps of url_launcher; declared so tests may
  # import them.
  url_launcher_platform_interface: any
  plugin_platform_interface: any

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/
    - assets/licenses/

  # Anek (Latin, Devanagari, Gujarati) and Readex Pro (Arabic), OFL 1.1.
  # Licenses in assets/licenses/, registered in main.dart. See DESIGN.md.
  fonts:
    - family: AnekLatin
      fonts:
        - asset: assets/fonts/AnekLatin-Regular.ttf
          weight: 400
        - asset: assets/fonts/AnekLatin-Medium.ttf
          weight: 500
        - asset: assets/fonts/AnekLatin-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/AnekLatin-Bold.ttf
          weight: 700
        - asset: assets/fonts/AnekLatin-ExtraBold.ttf
          weight: 800
    - family: AnekDevanagari
      fonts:
        - asset: assets/fonts/AnekDevanagari-Regular.ttf
          weight: 400
        - asset: assets/fonts/AnekDevanagari-Medium.ttf
          weight: 500
        - asset: assets/fonts/AnekDevanagari-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/AnekDevanagari-Bold.ttf
          weight: 700
        - asset: assets/fonts/AnekDevanagari-ExtraBold.ttf
          weight: 800
    - family: AnekGujarati
      fonts:
        - asset: assets/fonts/AnekGujarati-Regular.ttf
          weight: 400
        - asset: assets/fonts/AnekGujarati-Medium.ttf
          weight: 500
        - asset: assets/fonts/AnekGujarati-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/AnekGujarati-Bold.ttf
          weight: 700
        - asset: assets/fonts/AnekGujarati-ExtraBold.ttf
          weight: 800
    - family: ReadexPro
      fonts:
        - asset: assets/fonts/ReadexPro-Regular.ttf
          weight: 400
        - asset: assets/fonts/ReadexPro-Medium.ttf
          weight: 500
        - asset: assets/fonts/ReadexPro-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/ReadexPro-Bold.ttf
          weight: 700

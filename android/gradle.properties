org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true

# receive_sharing_intent 1.8.1 compiles Java for 1.8 while Kotlin follows the
# JDK, which Kotlin's JVM-target validation rejects. Downgrade the check from
# an error to ignored until the plugin is upgraded.
kotlin.jvm.target.validation.mode=IGNORE

# Specifies the API level to compile your project against.
compileSdkVersion=36

# Specifies the NDK version to use.
ndkVersion=27.0.12077973

# Specifies the minimum API level your app can run on.
minSdkVersion=24

# Specifies the API level your app is targeted to run on.
targetSdkVersion=36